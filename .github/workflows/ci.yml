name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db-test:
        image: postgres:18
        env:
          POSTGRES_USER: ecommerce_test
          POSTGRES_PASSWORD: ecommerce_test_password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U ecommerce_test -d ecommerce_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
